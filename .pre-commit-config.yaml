repos:
  - repo: local
    hooks:
      # Generated HTML isn't committed (CI builds and deploys it); this just
      # catches content or template errors before they reach CI.
      - id: build
        name: Build the site with Eleventy
        entry: npm run --silent build -- --quiet
        language: system
        pass_filenames: false
        files: ^(content/|terminal/|common/|assets/|eleventy\.config\.mjs$|package(-lock)?\.json$)
      - id: prettier
        name: Check JavaScript and HTML formatting
        entry: npm run format:check
        language: system
        pass_filenames: false
        files: \.(js|html)$
