<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Not Found | David Krasowska</title>

  <!-- Shortlink redirects — runs before the body renders. -->
  <script>
    const redirects = {
      '/resume': 'https://krasow.dev/assets/documents/Krasowska_David_resume.pdf',
      '/pim': 'https://northwestern.zoom.us/j/5406080251',
      '/village': 'https://northwestern.zoom.us/j/92716568456?pwd=0YxLTlbjAIXLJvvKgDLBigEQXpy2PZ.1',
      '/zoom': 'https://northwestern.zoom.us/my/krasow',
      '/github': 'https://github.com/krasow',
      '/contact': 'https://linktr.ee/krasow',
      '/cunumeric': 'https://krasow.dev/pages/show.html?page=cunumeric',
      '/legionpim': 'https://krasow.dev/pages/show.html?page=legionpim',
      '/compression': 'https://krasow.dev/pages/show.html?page=compression',
      '/polish': 'https://krasow.dev/pages/show.html?page=polish',
    };
    if (redirects[location.pathname]) location.replace(redirects[location.pathname]);
  </script>

  <!-- Theme (match the rest of the site) before paint. -->
  <script>
    (function () {
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); } catch (e) {}
    })();
  </script>

  <!-- Google Analytics -->
  <script src="/common/gtag.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root { --page: #eceef4; }
    html[data-theme="dark"] { --page: #0d0d0f; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--page);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; overflow: hidden;
    }

    .term {
      width: min(660px, 100%);
      background: #0b0b0f;
      border: 1px solid #23232b;
      border-radius: 10px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
      overflow: hidden;
      animation: rise .5s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    .bar {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; background: #15151b; border-bottom: 1px solid #23232b;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
    .tt { margin-left: 6px; color: #6b6b78; font-size: 12px; }

    .scr { padding: 34px 30px 30px; color: #e8eaf6; }

    .glitch {
      font-size: clamp(70px, 17vw, 132px);
      font-weight: 600; line-height: 1; letter-spacing: 4px;
      position: relative; width: max-content; margin: 0 auto 22px;
      color: #e8eaf6;
    }
    .glitch::before, .glitch::after {
      content: attr(data-t); position: absolute; inset: 0; overflow: hidden;
    }
    .glitch::before { color: #9fa8da; animation: g1 2.6s infinite steps(2); }
    .glitch::after  { color: #ff5f56; animation: g2 3.3s infinite steps(2); }
    @keyframes g1 { 0%,100% { clip-path: inset(0 0 82% 0); transform: translateX(-2px); } 50% { clip-path: inset(68% 0 0 0); transform: translateX(2px); } }
    @keyframes g2 { 0%,100% { clip-path: inset(78% 0 0 0); transform: translateX(2px); } 50% { clip-path: inset(0 0 72% 0); transform: translateX(-2px); } }

    .ln, .err { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; }
    .pr { color: #9fa8da; }
    .pth { color: #ffbd2e; }
    .err { color: #ff7b72; margin-bottom: 4px; }
    .cur {
      display: inline-block; width: 9px; height: 15px; vertical-align: -2px;
      background: #e8eaf6; animation: blink 1.05s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .hint { color: #6b6b78; font-size: 13px; margin-top: 24px; }
    .acts { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
    .acts a {
      color: #9fa8da; text-decoration: none; font-size: 13px;
      border: 1px solid #2c2c39; border-radius: 6px; padding: 7px 14px;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .acts a:hover { background: #9fa8da; color: #0b0b0f; border-color: #9fa8da; }

    @media (max-width: 560px) { .scr { padding: 26px 20px 24px; } }
    @media (prefers-reduced-motion: reduce) {
      .term, .glitch::before, .glitch::after, .cur { animation: none; }
    }
  </style>
</head>
<body>
  <main class="term" role="main">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="tt">david@krasow.dev — zsh</span>
    </div>
    <div class="scr">
      <div class="glitch" data-t="404">404</div>
      <p class="ln"><span class="pr">david@krasow.dev:~$</span> cat <span class="pth req">/</span></p>
      <p class="err">cat: <span class="req">/</span>: No such file or directory</p>
      <p class="ln"><span class="pr">david@krasow.dev:~$</span> <span class="cur"></span></p>

      <p class="hint"># that page doesn't exist — try one of these:</p>
      <nav class="acts">
        <a href="/index.html">cd ~</a>
        <a href="/index.html#projects">projects</a>
        <a href="/index.html#publications">publications</a>
        <a href="/pages/cv.html">cv</a>
      </nav>
    </div>
  </main>

  <script>
    var p = location.pathname || '/';
    document.querySelectorAll('.req').forEach(function (el) { el.textContent = p; });
  </script>
</body>
</html>
