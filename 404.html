<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Not Found | David Krasowska</title>

  <!-- Shortlink redirects — run before anything renders. -->
  <script>
    (() => {
      const redirects = {
        '/resume': 'https://krasow.dev/assets/documents/Krasowska_David_resume.pdf',
        '/pim': 'https://northwestern.zoom.us/j/5406080251',
        '/village': 'https://northwestern.zoom.us/j/92716568456?pwd=0YxLTlbjAIXLJvvKgDLBigEQXpy2PZ.1',
        '/zoom': 'https://northwestern.zoom.us/my/krasow',
        '/github': 'https://github.com/krasow',
        '/contact': '/assets/documents/Krasowska_David_contact.vcf',
        '/cunumeric': 'https://krasow.dev/pages/show.html?page=cunumeric',
        '/legionpim': 'https://krasow.dev/pages/show.html?page=legionpim',
        '/compression': 'https://krasow.dev/pages/show.html?page=compression',
        '/polish': 'https://krasow.dev/pages/show.html?page=polish',
      };
      const target = redirects[location.pathname];
      if (target) location.replace(target);
    })();
  </script>

  <!-- Match the site theme before paint. -->
  <script>
    (() => {
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); } catch (e) {}
    })();
  </script>

  <script src="/common/gtag.js"></script>

  <!-- theme.css: --bg-page, --terminal-*, --card-border, --shadow, …  -  Font Awesome: footer icons -->
  <link rel="stylesheet" href="/common/css/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    /* ---- Page layout ---------------------------------------------------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ---- Footer (Bootstrap's .btn isn't loaded here, so style it) -------- */
    .footer { padding-left: 0 !important; gap: 6px; }
    .footer .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      color: var(--footer-text);
      font-size: 18px;
      line-height: 1;
      text-decoration: none;
      transition: opacity .18s ease;
    }
    .footer .btn:hover { opacity: .72; }

    /* ---- Terminal panel (black card + accent stripe, like the homepage) -- */
    .term {
      width: min(720px, 100%);
      height: min(640px, calc(100dvh - 120px));
      padding: 36px 30px 30px;
      display: flex;
      flex-direction: column;
      background: var(--terminal-bg);
      color: var(--terminal-text);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--terminal-accent);
      box-shadow: 0 20px 50px var(--shadow);
      animation: rise .5s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    /* ---- Glitchy banner ------------------------------------------------- */
    .banner { margin: 0 auto 24px; }
    .glitch {
      display: block;
      position: relative;
      width: max-content;
      max-width: 100%;
      margin: 0 auto;
      color: var(--terminal-text);
      font-size: clamp(34px, 11vw, 74px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 4px;
    }
    .glitch::before,
    .glitch::after { content: attr(data-t); position: absolute; inset: 0; overflow: hidden; color: var(--terminal-accent); }
    .glitch::before { animation: g1 2.6s infinite steps(2); }
    .glitch::after  { opacity: .5; animation: g2 3.3s infinite steps(2); }
    @keyframes g1 { 0%,100% { clip-path: inset(0 0 82% 0); transform: translateX(-2px); } 50% { clip-path: inset(68% 0 0 0); transform: translateX(2px); } }
    @keyframes g2 { 0%,100% { clip-path: inset(78% 0 0 0); transform: translateX(2px); } 50% { clip-path: inset(0 0 72% 0); transform: translateX(-2px); } }

    /* ---- Terminal session (log + prompt + input) ------------------------ */
    .ln {
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }
    .pr  { color: var(--terminal-accent); }
    .pth { color: var(--terminal-text); }
    .go  { color: var(--terminal-accent); }
    .err { color: var(--terminal-text); opacity: .65; }
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }
    .help {
      display: grid;
      grid-template-columns: max-content 1fr;
      column-gap: 18px;
    }
    .help-command { color: var(--terminal-accent); }
    .help-description { opacity: .65; }
    .help-section {
      grid-column: 1 / -1;
      margin-top: 10px;
      font-size: 12px;
      letter-spacing: .08em;
      opacity: .5;
      text-transform: uppercase;
    }
    .help-section:first-child { margin-top: 0; }
    .help-note { grid-column: 1 / -1; margin-top: 8px; }

    #cmd { display: flex; flex: none; align-items: center; }
    #in {
      flex: 1;
      min-width: 0;
      margin-left: 8px;
      padding: 0;
      background: transparent;
      border: 0;
      outline: 0;
      font: inherit;
      color: var(--terminal-text);
      caret-color: var(--terminal-accent);
    }
    .mobile-keys { display: none; }

    /* ---- Hint ----------------------------------------------------------- */
    .hint { margin-top: 24px; color: var(--terminal-text); opacity: .55; font-size: 13px; }

    /* ---- Responsive / motion -------------------------------------------- */
    @media (max-width: 560px) {
      .term {
        height: calc(100dvh - 96px);
        padding: 28px 20px 24px;
      }
      .glitch {
        font-size: clamp(20px, 7vw, 32px);
        letter-spacing: 2px;
      }
      .help { grid-template-columns: 1fr; }
      .help-description { margin-bottom: 5px; }
      .help-note { grid-column: 1; }
      .mobile-keys {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .mobile-key {
        padding: 3px 9px;
        color: var(--terminal-text);
        background: transparent;
        border: 1px solid var(--card-border);
        font: inherit;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .term, .glitch::before, .glitch::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="term">
      <div class="banner">
        <span class="glitch" data-t="krasow.dev">krasow.dev 404</span>
      </div>

      <div id="log">
        <p class="ln"><span class="pr">david:~$</span> <span class="req">/</span></p>
        <p class="ln err">zsh: no such file or directory: <span class="req">/</span></p>
        <p class="hint"># that page didn't exist. use <span class="pth">help</span> for more details.</p>
      </div>

      <form id="cmd" class="ln" autocomplete="off">
        <span id="prompt" class="pr">david:~$</span>
        <input id="in" type="text" spellcheck="false" autocomplete="off" aria-label="terminal input">
      </form>
      <div class="mobile-keys" aria-label="Terminal keys">
        <button class="mobile-key" type="button" data-key="Tab">Tab</button>
        <button class="mobile-key" type="button" data-key="ArrowUp">↑</button>
        <button class="mobile-key" type="button" data-key="ArrowDown">↓</button>
        <button class="mobile-key" type="button" data-key="Escape">Esc</button>
      </div>
    </main>
  </div>

  <div id="site-footer"></div>

  <script>
    (() => {
      "use strict";

      const terminal = document.querySelector('.term');
      const log = document.getElementById('log');
      const input = document.getElementById('in');
      const prompt = document.getElementById('prompt');
      const scrollLog = () => { log.scrollTop = log.scrollHeight; };

      const routes = {
        home:          '/index.html',
        projects:      '/index.html#projects',
        publications:  '/index.html#publications',
        posters:       '/pages/presentations.html',
        experience:    '/index.html#experience',
        cv:            '/pages/cv.html',
        about:         '/pages/about.html',
        news:          '/pages/news.html',
        presentations: '/pages/presentations.html',
        resume:        'https://krasow.dev/assets/documents/Krasowska_David_resume.pdf',
        github:        'https://github.com/krasow',
        zoom:          'https://northwestern.zoom.us/my/krasow',
        contact:       '/assets/documents/Krasowska_David_contact.vcf',
      };
      const files = {
        'contact.vcf': routes.contact,
        'resume.pdf': routes.resume,
      };
      const rootEntries = [
        'about',
        'contact.vcf',
        'cv',
        'experience',
        'home',
        'news',
        'posters/',
        'presentations/',
        'projects/',
        'publications/',
        'resume.pdf',
        'scripts/',
      ];

      const folders = {
        projects: [
          ['cunumeric', '/pages/show.html?page=cunumeric'],
          ['legionpim', '/pages/show.html?page=legionpim'],
          ['compression', '/pages/show.html?page=compression'],
        ],
        publications: [
          ['VILLAGE25', 'https://www.mccormick.northwestern.edu/computer-science/documents/nu-cs-2025-33.pdf'],
          ['CLUSTER23', 'https://www.computer.org/csdl/proceedings-article/cluster/2023/079200a247/1SfUsploNQQ'],
          ['IJHPCA23', 'https://journals.sagepub.com/doi/abs/10.1177/10943420231179417'],
          ['DRBSD21', 'https://ieeexplore.ieee.org/abstract/document/9652575'],
        ],
        posters: [
          ['CSGF26', '/assets/documents/posters/2026_csgf_krasowska.pdf'],
          ['GCASR26', '/assets/documents/posters/2026_gcasr_krasowska.pdf'],
          ['CSGF25', '/assets/documents/posters/2025_csgf_krasoska.pdf'],
          ['SC22', '/assets/documents/posters/poster_krasowska.pdf'],
        ],
        presentations: [
          ['JULIACON25', '/assets/documents/slides/2025/juliacon.pdf'],
          ['LEGION24', '/assets/documents/slides/2024/legion24.pdf'],
          ['CONSTELLATION23', '/assets/documents/slides/2023/Constellation_Krasowska.pdf'],
          ['GRADSCHOOL22', '/assets/documents/slides/2022/grad_school_talk_dube_krasowska.pdf'],
          ['SC22', '/assets/documents/slides/2022/best_krasowska.pdf'],
          ['SASSY22', '/assets/documents/slides/2022/prediction_lossy_compression_krasowska.pdf'],
          ['DRBSD21', '/assets/documents/slides/2021/DRBSB-7-Krasowska.pdf'],
        ],
        scripts: [
          ['cunumeric-install.sh', '/scripts/cunumeric-install.sh'],
        ],
      };

      const responses = {
        name:     'David Krasowska',
        email:    'david@krasow.dev',
        phone:    '+1 (224) 355-2715',
        location: 'Chicago, IL',
      };
      const hiddenResponses = {
        hi:    'Hello!',
        hello: 'Hello!',
      };

      const folderEntries = Object.fromEntries(
        Object.entries(folders).map(([folder, entries]) => [
          folder,
          new Map(entries),
        ]),
      );
      const entryRoutes = new Map(
        Object.values(folders).flat(),
      );

      const completions = [...new Set([
        'help',
        'clear',
        'pwd',
        'tree',
        'whoami',
        'show',
        'ls',
        ...Object.keys(folders).map((folder) => `ls ${folder}`),
        'cd',
        'cd ..',
        'cd -',
        ...Object.keys(folders).map((folder) => `cd ${folder}`),
        ...folders.scripts.map(([name]) => `show ${name}`),
        ...Object.keys(routes),
        ...Object.keys(files),
        ...Object.keys(responses),
        ...Object.entries(folders).flatMap(([folder, entries]) => (
          entries.flatMap(([name]) => [name, `${folder}/${name}`])
        )),
      ])];

      const commandHistory = [];
      let cursor = 0;
      let currentDirectory = '';
      let previousDirectory = null;

      const promptText = () => (
        currentDirectory ? `david:~/${currentDirectory}$` : 'david:~$'
      );

      const append = (node) => {
        log.append(node);
        scrollLog();
      };

      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        node.className = className;
        node.textContent = text;
        return node;
      };

      const write = (text, className = '') => {
        append(element('p', `ln ${className}`.trim(), text));
      };

      const echo = (command) => {
        const line = element('p', 'ln', '');
        line.append(element('span', 'pr', promptText()), ` ${command}`);
        append(line);
      };

      const showHelp = () => {
        const groups = [
          ['Navigation', [
            ['ls [folder]', 'list pages or folder contents'],
            ['cd folder · cd .. · cd -', 'change directory'],
            ['pwd · tree', 'inspect the current directory'],
            ['show script', 'print an install command'],
          ]],
          ['Information', [
            ['whoami · name', 'show name'],
            ['email · phone · location', 'show contact details'],
          ]],
          ['Links', [
            ['github · zoom', 'open an external page'],
            ['resume · contact', 'open or download a document'],
          ]],
          ['Controls', [
            ['clear', 'clear the terminal'],
            ['Esc', 'clear current input'],
            ['↑ / ↓ · Tab', 'history and autocomplete'],
          ]],
        ];

        const help = element('div', 'ln help', '');
        groups.forEach(([heading, rows]) => {
          help.append(element('span', 'help-section', heading));
          rows.forEach(([command, description]) => {
            help.append(
              element('span', 'help-command', command),
              element('span', 'help-description', description),
            );
          });
        });
        help.append(element(
          'span',
          'help-note',
          'Type any item shown by ls to open it.',
        ));
        append(help);
      };

      const normalize = (value) => value.trim();

      const resolve = (command) => {
        const path = normalize(command).replace(/^\/+|\/+$/g, '');
        const [folder, entry, extra] = path.split('/');
        if (entry && !extra) return folderEntries[folder]?.get(entry);
        if (entry) return undefined;
        return routes[folder]
          ?? files[folder]
          ?? folderEntries[currentDirectory]?.get(folder)
          ?? entryRoutes.get(folder);
      };

      const list = (directory) => {
        directory ||= currentDirectory;
        if (!directory) {
          write(rootEntries.join('   '), 'pth');
          return;
        }

        const entries = folders[directory];
        if (entries) {
          const names = entries.map(([name]) => name);
          if (directory === 'projects') names.sort((a, b) => a.localeCompare(b));
          write(names.join('   '), 'pth');
        }
        else write(`ls: ${directory}: not a directory`, 'err');
      };

      const changeDirectory = (target) => {
        const directory = target.replace(/^\/+|\/+$/g, '');
        let nextDirectory;
        if (directory === '-') {
          if (previousDirectory === null) {
            write('cd: no previous directory', 'err');
            return;
          }
          nextDirectory = previousDirectory;
        } else if (!directory || directory === '~' || directory === '..') {
          nextDirectory = '';
        } else if (folders[directory]) {
          nextDirectory = directory;
        } else {
          write(`cd: no such file or directory: ${target}`, 'err');
          return;
        }
        previousDirectory = currentDirectory;
        currentDirectory = nextDirectory;
        prompt.textContent = promptText();
      };

      const showTree = () => {
        const lines = ['.'];
        if (currentDirectory) {
          folders[currentDirectory].forEach(([name], index, entries) => {
            const branch = index === entries.length - 1 ? '└──' : '├──';
            lines.push(`${branch} ${name}`);
          });
          write(lines.join('\n'), 'pth');
          return;
        }

        rootEntries.forEach((entry, index) => {
          const isLast = index === rootEntries.length - 1;
          const branch = isLast ? '└──' : '├──';
          lines.push(`${branch} ${entry}`);
          const directory = entry.endsWith('/') ? entry.slice(0, -1) : '';
          if (!directory) return;
          const stem = isLast ? '    ' : '│   ';
          folders[directory].forEach(([name], childIndex, children) => {
            const childBranch = childIndex === children.length - 1 ? '└──' : '├──';
            lines.push(`${stem}${childBranch} ${name}`);
          });
        });
        write(lines.join('\n'), 'pth');
      };

      const displayScript = (path) => {
        const name = path.replace(/^scripts\//, '');
        const url = folderEntries.scripts.get(name);
        if (!url) {
          write(`show: no such script: ${path}`, 'err');
          return;
        }
        write(`curl -fsSL https://krasow.dev${url} | bash`, 'pth');
      };

      const navigate = (url) => {
        write(url.endsWith('.vcf') ? '→ downloading contact.vcf' : `→ ${url}`, 'go');
        setTimeout(() => { location.href = url; }, 120);
      };

      const run = (raw) => {
        const command = raw.trim();
        echo(command);
        if (!command) return;
        commandHistory.push(command);
        cursor = commandHistory.length;

        const [name, ...args] = normalize(command).split(/\s+/);
        if (!args.length && name === 'clear') { log.replaceChildren(); return; }
        if (!args.length && name === 'help') { showHelp(); return; }
        if (!args.length && name === 'pwd') { write(`~${currentDirectory ? `/${currentDirectory}` : ''}`, 'pth'); return; }
        if (!args.length && name === 'tree') { showTree(); return; }
        if (!args.length && name === 'whoami') { write(responses.name, 'pth'); return; }
        if (name === 'ls') { list(args.join(' ')); return; }
        if (name === 'cd' && args.length <= 1) { changeDirectory(args[0] ?? ''); return; }
        if (name === 'show' && args.length === 1) { displayScript(args[0]); return; }
        const response = responses[name] ?? hiddenResponses[name];
        if (response && !args.length) { write(response, 'pth'); return; }

        const url = resolve(command);
        if (!url) {
          write(`zsh: no such command, file, or directory: ${command}`, 'err');
          return;
        }
        navigate(url);
      };

      const recall = (delta) => {
        cursor = Math.max(0, Math.min(commandHistory.length, cursor + delta));
        input.value = commandHistory[cursor] ?? '';
      };

      const complete = () => {
        const typed = input.value.trim();
        if (!typed) return;
        const matches = completions.filter((command) => (
          command.startsWith(typed)
        ));
        if (!matches.length) return;
        if (matches.length === 1) {
          input.value = matches[0];
          return;
        }

        let common = matches[0];
        for (const match of matches.slice(1)) {
          let end = 0;
          while (end < common.length && common[end] === match[end]) end += 1;
          common = common.slice(0, end);
        }
        if (common.length > typed.length) {
          input.value = matches[0].slice(0, common.length);
        } else {
          const isDirectoryCommand = typed === 'ls' || typed.startsWith('ls ')
            || typed === 'cd' || typed.startsWith('cd ');
          const choices = isDirectoryCommand
            ? matches.filter((match) => match.includes(' ')).map((match) => match.split(' ')[1])
            : matches;
          choices.sort((a, b) => a.localeCompare(b));
          if (choices.length) write(choices.join('   '), 'pth');
        }
      };

      document.getElementById('cmd').addEventListener('submit', (e) => {
        e.preventDefault();
        run(input.value);
        input.value = '';
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp')        { recall(-1); e.preventDefault(); }
        else if (e.key === 'ArrowDown') { recall(1);  e.preventDefault(); }
        else if (e.key === 'Tab')       { complete();  e.preventDefault(); }
        else if (e.key === 'Escape')    { input.value = ''; }
      });
      document.querySelector('.mobile-keys').addEventListener('click', (e) => {
        const key = e.target.closest('[data-key]')?.dataset.key;
        if (key === 'Tab') complete();
        else if (key === 'ArrowUp') recall(-1);
        else if (key === 'ArrowDown') recall(1);
        else if (key === 'Escape') input.value = '';
        input.focus();
      });
      terminal.addEventListener('click', () => input.focus());
      input.focus();

      // Fill in the path that 404'd.
      const path = location.pathname || '/';
      document.querySelectorAll('.req').forEach((el) => { el.textContent = path; });

      // Load the shared footer fragment.
      fetch('/common/footer.html')
        .then((res) => res.text())
        .then((html) => { document.getElementById('site-footer').innerHTML = html; })
        .catch(() => {});
    })();
  </script>
</body>
</html>
