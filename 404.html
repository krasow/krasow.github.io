<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Not Found | David Krasowska</title>

  <!-- Shortlink redirects — run before anything renders. -->
  <script>
    (() => {
      const redirects = {
        '/resume': 'https://krasow.dev/assets/documents/Krasowska_David_resume.pdf',
        '/pim': 'https://northwestern.zoom.us/j/5406080251',
        '/village': 'https://northwestern.zoom.us/j/92716568456?pwd=0YxLTlbjAIXLJvvKgDLBigEQXpy2PZ.1',
        '/zoom': 'https://northwestern.zoom.us/my/krasow',
        '/github': 'https://github.com/krasow',
        '/contact': '/assets/documents/Krasowska_David_contact.vcf',
        '/cunumeric': 'https://krasow.dev/pages/show.html?page=cunumeric',
        '/legionpim': 'https://krasow.dev/pages/show.html?page=legionpim',
        '/compression': 'https://krasow.dev/pages/show.html?page=compression',
        '/polish': 'https://krasow.dev/pages/show.html?page=polish',
      };
      const target = redirects[location.pathname];
      if (target) location.replace(target);
    })();
  </script>

  <!-- Match the site theme before paint. -->
  <script>
    (() => {
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); } catch (e) {}
    })();
  </script>

  <script src="/common/gtag.js"></script>

  <!-- theme.css: --bg-page, --terminal-*, --card-border, --shadow, …  -  Font Awesome: footer icons -->
  <link rel="stylesheet" href="/common/css/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    /* ---- Page layout ---------------------------------------------------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ---- Footer (Bootstrap's .btn isn't loaded here, so style it) -------- */
    .footer { padding-left: 0 !important; gap: 6px; }
    .footer .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      color: var(--footer-text);
      font-size: 18px;
      line-height: 1;
      text-decoration: none;
      transition: opacity .18s ease;
    }
    .footer .btn:hover { opacity: .72; }

    /* ---- Terminal panel (black card + accent stripe, like the homepage) -- */
    .term {
      width: min(720px, 100%);
      height: min(600px, calc(100dvh - 120px));
      padding: 36px 30px 30px;
      display: flex;
      flex-direction: column;
      background: var(--terminal-bg);
      color: var(--terminal-text);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--terminal-accent);
      box-shadow: 0 20px 50px var(--shadow);
      animation: rise .5s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    /* ---- Glitchy banner ------------------------------------------------- */
    .banner { margin: 0 auto 24px; }
    .glitch {
      display: block;
      position: relative;
      width: max-content;
      max-width: 100%;
      margin: 0 auto;
      color: var(--terminal-text);
      font-size: clamp(34px, 11vw, 74px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 4px;
    }
    .glitch::before,
    .glitch::after { content: attr(data-t); position: absolute; inset: 0; overflow: hidden; color: var(--terminal-accent); }
    .glitch::before { animation: g1 2.6s infinite steps(2); }
    .glitch::after  { opacity: .5; animation: g2 3.3s infinite steps(2); }
    @keyframes g1 { 0%,100% { clip-path: inset(0 0 82% 0); transform: translateX(-2px); } 50% { clip-path: inset(68% 0 0 0); transform: translateX(2px); } }
    @keyframes g2 { 0%,100% { clip-path: inset(78% 0 0 0); transform: translateX(2px); } 50% { clip-path: inset(0 0 72% 0); transform: translateX(-2px); } }

    /* ---- Terminal session (log + prompt + input) ------------------------ */
    .ln {
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }
    .pr  { color: var(--terminal-accent); }
    .pth { color: var(--terminal-text); }
    .go  { color: var(--terminal-accent); }
    .err { color: var(--terminal-text); opacity: .65; }
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }
    .help {
      display: grid;
      grid-template-columns: max-content 1fr;
      column-gap: 18px;
    }
    .help-command { color: var(--terminal-accent); }
    .help-description { opacity: .65; }
    .help-note { grid-column: 1 / -1; margin-top: 8px; }

    #cmd { display: flex; flex: none; align-items: center; }
    #in {
      flex: 1;
      min-width: 0;
      margin-left: 8px;
      padding: 0;
      background: transparent;
      border: 0;
      outline: 0;
      font: inherit;
      color: var(--terminal-text);
      caret-color: var(--terminal-accent);
    }

    /* ---- Hint ----------------------------------------------------------- */
    .hint { margin-top: 24px; color: var(--terminal-text); opacity: .55; font-size: 13px; }

    /* ---- Responsive / motion -------------------------------------------- */
    @media (max-width: 560px) {
      .term {
        height: calc(100dvh - 96px);
        padding: 28px 20px 24px;
      }
      .help { grid-template-columns: 1fr; }
      .help-description { margin-bottom: 5px; }
      .help-note { grid-column: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .term, .glitch::before, .glitch::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="term">
      <div class="banner">
        <span class="glitch" data-t="KRASOW">404 krasow.dev</span>
      </div>

      <div id="log">
        <p class="ln"><span class="pr">david:~$</span> <span class="req">/</span></p>
        <p class="ln err">zsh: no such file or directory: <span class="req">/</span></p>
        <p class="hint"># that page didn't exist. use <span class="pth">ls</span> to explore.</p>
      </div>

      <form id="cmd" class="ln" autocomplete="off">
        <span class="pr">david:~$</span>
        <input id="in" type="text" spellcheck="false" autocomplete="off" aria-label="terminal input">
      </form>
    </main>
  </div>

  <div id="site-footer"></div>

  <script>
    (() => {
      "use strict";

      const terminal = document.querySelector('.term');
      const log = document.getElementById('log');
      const input = document.getElementById('in');
      const scrollLog = () => { log.scrollTop = log.scrollHeight; };

      // What you can type -> where it goes.
      const ROUTES = {
        home:          '/index.html',
        projects:      '/index.html#projects',
        publications:  '/index.html#publications',
        experience:    '/index.html#experience',
        cv:            '/pages/cv.html',
        about:         '/pages/about.html',
        news:          '/pages/news.html',
        presentations: '/pages/presentations.html',
        resume:        'https://krasow.dev/assets/documents/Krasowska_David_resume.pdf',
        github:        'https://github.com/krasow',
        zoom:          'https://northwestern.zoom.us/my/krasow',
        contact:       '/assets/documents/Krasowska_David_contact.vcf',
      };
      // "projects" acts like a folder: `ls projects`, then a name (or projects/<name>).
      const PROJECTS = {
        cunumeric:   '/pages/show.html?page=cunumeric',
        legionpim:   '/pages/show.html?page=legionpim',
        compression: '/pages/show.html?page=compression',
        polish:      '/pages/show.html?page=polish',
      };
      // Publication handles shown by `ls publications`.
      const PUBLICATIONS = {
        village25: {
          label: 'VILLAGE25',
          url: 'https://www.mccormick.northwestern.edu/computer-science/documents/nu-cs-2025-33.pdf',
        },
        cluster23: {
          label: 'CLUSTER23',
          url: 'https://www.computer.org/csdl/proceedings-article/cluster/2023/079200a247/1SfUsploNQQ',
        },
        ijhpca23: {
          label: 'IJHPCA23',
          url: 'https://journals.sagepub.com/doi/abs/10.1177/10943420231179417',
        },
        drbsd21: {
          label: 'DRBSD21',
          url: 'https://ieeexplore.ieee.org/abstract/document/9652575',
        },
      };
      const RESPONSES = {
        name:     'David Krasowska',
        email:    'david@krasow.dev',
        phone:    '+1 (224) 355-2715',
        location: 'Chicago, IL',
      };

      const history = [];
      let cursor = 0;

      // Append a terminal line. textContent keeps typed input safe by construction.
      const write = (text, cls) => {
        const p = document.createElement('p');
        p.className = cls ? `ln ${cls}` : 'ln';
        p.textContent = text;
        log.append(p);
        scrollLog();
      };

      // Echo the entered command beside the prompt.
      const echo = (command) => {
        const prompt = document.createElement('span');
        prompt.className = 'pr';
        prompt.textContent = 'david:~$';
        const p = document.createElement('p');
        p.className = 'ln';
        p.append(prompt, ` ${command}`);
        log.append(p);
        scrollLog();
      };

      const writeHelp = () => {
        const help = document.createElement('div');
        help.className = 'ln help';
        const rows = [
          ['ls', 'list pages'],
          ['ls projects', 'list projects'],
          ['ls publications', 'list publications'],
          ['name · email · phone', 'contact details'],
          ['location', 'location'],
          ['zoom', 'open meeting page'],
          ['clear', 'clear the terminal'],
          ['↑ / ↓', 'command history'],
        ];
        rows.forEach(([command, description]) => {
          const lhs = document.createElement('span');
          lhs.className = 'help-command';
          lhs.textContent = command;
          const rhs = document.createElement('span');
          rhs.className = 'help-description';
          rhs.textContent = description;
          help.append(lhs, rhs);
        });
        const note = document.createElement('span');
        note.className = 'help-note';
        note.textContent = 'Type any listed page, project, or publication to open it.';
        help.append(note);
        log.append(help);
        scrollLog();
      };

      // Resolve a typed name / path to a destination URL. Supports the
      // Folder entries can also be opened as projects/<name> or publications/<name>.
      const resolve = (command) => {
        const clean = command.toLowerCase().replace(/^\/+|\/+$/g, '').trim();
        const [head, tail] = clean.split('/');
        if (head === 'projects' && tail) return PROJECTS[tail];
        if (head === 'publications' && tail) return PUBLICATIONS[tail]?.url;
        return ROUTES[head] ?? PROJECTS[head] ?? PUBLICATIONS[head]?.url;
      };

      // `ls` (top level), `ls projects`, and `ls publications`.
      const list = (dir) => {
        if (!dir) {
          write(Object.keys(ROUTES).map((k) => (
            k === 'projects' || k === 'publications' ? `${k}/` : k
          )).join('   '), 'pth');
        } else if (dir === 'projects') {
          write(Object.keys(PROJECTS).join('   '), 'pth');
        } else if (dir === 'publications') {
          write(Object.values(PUBLICATIONS).map(({ label }) => label).join('   '), 'pth');
        } else {
          write(`ls: ${dir}: not a directory`, 'err');
        }
      };

      const run = (raw) => {
        const command = raw.trim();
        echo(command);
        if (!command) return;
        history.push(command);
        cursor = history.length;

        const lower = command.toLowerCase();
        if (lower === 'clear') { log.replaceChildren(); return; }
        if (lower === 'help') {
          writeHelp();
          return;
        }
        if (lower === 'ls' || lower.startsWith('ls ')) { list(lower.slice(2).trim()); return; }
        if (RESPONSES[lower]) { write(RESPONSES[lower], 'pth'); return; }

        const dest = resolve(command);
        if (!dest) {
          write(`zsh: no such file or directory: ${command}`, 'err');
          return;
        }
        write(dest.endsWith('.vcf') ? '→ downloading contact.vcf' : `→ ${dest}`, 'go');
        setTimeout(() => { location.href = dest; }, 120);
      };

      const recall = (delta) => {
        cursor = Math.max(0, Math.min(history.length, cursor + delta));
        input.value = history[cursor] ?? '';
      };

      document.getElementById('cmd').addEventListener('submit', (e) => {
        e.preventDefault();
        run(input.value);
        input.value = '';
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp')        { recall(-1); e.preventDefault(); }
        else if (e.key === 'ArrowDown') { recall(1);  e.preventDefault(); }
      });
      terminal.addEventListener('click', () => input.focus());
      input.focus();

      // Fill in the path that 404'd.
      const path = location.pathname || '/';
      document.querySelectorAll('.req').forEach((el) => { el.textContent = path; });

      // Load the shared footer fragment.
      fetch('/common/footer.html')
        .then((res) => res.text())
        .then((html) => { document.getElementById('site-footer').innerHTML = html; })
        .catch(() => {});
    })();
  </script>
</body>
</html>
