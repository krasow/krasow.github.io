<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Not Found | David Krasowska</title>

  <!-- Shortlink redirects — runs before the body renders. -->
  <script>
    const redirects = {
      '/resume': 'https://krasow.dev/assets/documents/Krasowska_David_resume.pdf',
      '/pim': 'https://northwestern.zoom.us/j/5406080251',
      '/village': 'https://northwestern.zoom.us/j/92716568456?pwd=0YxLTlbjAIXLJvvKgDLBigEQXpy2PZ.1',
      '/zoom': 'https://northwestern.zoom.us/my/krasow',
      '/github': 'https://github.com/krasow',
      '/contact': 'https://linktr.ee/krasow',
      '/cunumeric': 'https://krasow.dev/pages/show.html?page=cunumeric',
      '/legionpim': 'https://krasow.dev/pages/show.html?page=legionpim',
      '/compression': 'https://krasow.dev/pages/show.html?page=compression',
      '/polish': 'https://krasow.dev/pages/show.html?page=polish',
    };
    if (redirects[location.pathname]) location.replace(redirects[location.pathname]);
  </script>

  <!-- Theme (match the rest of the site) before paint. -->
  <script>
    (function () {
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); } catch (e) {}
    })();
  </script>

  <!-- Google Analytics -->
  <script src="/common/gtag.js"></script>

  <!-- Site theme variables (--bg-page, --terminal-*, --card-border, --shadow, …). -->
  <link rel="stylesheet" type="text/css" href="/common/css/theme.css">
  <!-- Font Awesome for the footer's social icons. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      display: flex; flex-direction: column;
      min-height: 100vh;
    }
    .wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    /* No navbar on this page, so drop the footer's navbar gutter. */
    .footer { padding-left: 0 !important; }

    /* Same look as the homepage terminal: black panel on the page background,
       with the active-command accent stripe on the left. */
    .term {
      width: min(640px, 100%);
      background: var(--terminal-bg);
      color: var(--terminal-text);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--terminal-accent);
      box-shadow: 0 20px 50px var(--shadow);
      padding: 36px 30px 30px;
      animation: rise .5s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    .glitch {
      font-size: clamp(68px, 17vw, 128px);
      font-weight: 700; line-height: 1; letter-spacing: 4px;
      position: relative; width: max-content; margin: 0 auto 22px;
      color: var(--terminal-text);
    }
    .glitch::before, .glitch::after { content: attr(data-t); position: absolute; inset: 0; overflow: hidden; }
    .glitch::before { color: var(--terminal-accent); animation: g1 2.6s infinite steps(2); }
    .glitch::after  { color: var(--terminal-accent); opacity: .5; animation: g2 3.3s infinite steps(2); }
    @keyframes g1 { 0%,100% { clip-path: inset(0 0 82% 0); transform: translateX(-2px); } 50% { clip-path: inset(68% 0 0 0); transform: translateX(2px); } }
    @keyframes g2 { 0%,100% { clip-path: inset(78% 0 0 0); transform: translateX(2px); } 50% { clip-path: inset(0 0 72% 0); transform: translateX(-2px); } }

    .ln, .err { font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-all; }
    .pr  { color: var(--terminal-accent); }
    .pth { color: var(--terminal-text); }
    .err { color: var(--terminal-text); opacity: .65; margin-bottom: 2px; }
    .cur {
      display: inline-block; width: 9px; height: 15px; vertical-align: -2px;
      background: var(--terminal-text); animation: blink 1.05s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .hint { color: var(--terminal-text); opacity: .55; font-size: 13px; margin-top: 24px; }
    .acts { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
    .acts a {
      color: var(--terminal-accent); text-decoration: none; font-size: 13px;
      border: 1px solid var(--card-border); border-radius: 4px; padding: 7px 14px;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .acts a:hover { background: var(--terminal-accent); color: var(--terminal-bg); border-color: var(--terminal-accent); }

    @media (max-width: 560px) { .term { padding: 28px 20px 24px; } }
    @media (prefers-reduced-motion: reduce) {
      .term, .glitch::before, .glitch::after, .cur { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
  <main class="term" role="main">
    <div class="glitch" data-t="404">404</div>
    <p class="ln"><span class="pr">david:~$</span> cat <span class="pth req">/</span></p>
    <p class="err">cat: <span class="req">/</span>: No such file or directory</p>
    <p class="ln"><span class="pr">david:~$</span> <span class="cur"></span></p>

    <p class="hint"># that page doesn't exist — try one of these:</p>
    <nav class="acts">
      <a href="/index.html">home</a>
      <a href="/index.html#projects">projects</a>
      <a href="/index.html#publications">publications</a>
      <a href="/pages/cv.html">cv</a>
    </nav>
  </main>
  </div>

  <div id="site-footer"></div>

  <script>
    var p = location.pathname || '/';
    document.querySelectorAll('.req').forEach(function (el) { el.textContent = p; });

    // Load the shared footer fragment (its <link> and markup apply on inject).
    fetch('/common/footer.html')
      .then(function (r) { return r.text(); })
      .then(function (html) { document.getElementById('site-footer').innerHTML = html; })
      .catch(function () {});
  </script>
</body>
</html>
